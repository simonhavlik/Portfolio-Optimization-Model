<section class="research-section" id="portfolio-explorer" aria-labelledby="explorer-heading"
         data-explorer="{{ url_for('leaderboard_explorer_data') }}">
  <div class="explorer-heading">
    <h2 id="explorer-heading">Portfolio comparison</h2>
    <form class="research-quarter explorer-controls" hidden>
      <label>Measure<select id="explore-measure">
        <option value="performance">Cumulative return</option>
        <optgroup label="Filing history" id="explore-filings">
          <option value="value">Reported equity value</option>
          <option value="top10">Top-ten concentration</option>
          <option value="effective">Effective holdings</option>
          <option value="weight_shift">Quarterly weight reshuffle</option>
          <option value="new">New holdings</option>
          <option value="exited">Exited holdings</option>
        </optgroup>
        <optgroup label="Calendar-year risk and return">
          <option value="return">Annual return</option>
          <option value="risk:volatility">Annual volatility</option>
          <option value="risk:max_drawdown">Annual max drawdown</option>
          <option value="risk:sharpe_ratio">Annual Sharpe ratio</option>
          <option value="risk:alpha">Annual alpha vs SPY</option>
        </optgroup>
      </select></label>
      <label>Manager<select id="explore-manager" aria-label="Manager to add"><option value="">Select a manager</option></select></label>
      <button type="submit" class="research-button">Add</button>
      <button type="button" class="research-button" id="explore-reset">Reset zoom</button>
    </form>
  </div>
  <div id="explore-plot" role="region" aria-label="Interactive portfolio comparison"></div>
  <p id="explore-readout" class="research-meta" role="status"></p>
  <script id="explore-performance" type="application/json">{{ performance | tojson }}</script>
</section>
